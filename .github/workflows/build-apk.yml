name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Engine tests (3000 simulated games)
        run: ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.chaosparty.engine.*'
      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.CP_KEYSTORE_B64 }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "CP_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK and AAB
        env:
          CP_KEYSTORE_PASSWORD: ${{ secrets.CP_KEYSTORE_PASSWORD }}
          CP_KEY_ALIAS: ${{ secrets.CP_KEY_ALIAS }}
          CP_KEY_PASSWORD: ${{ secrets.CP_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease -PrelayUrl="${{ vars.RELAY_URL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ChaosParty
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
